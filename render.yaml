services:
  - type: web
    name: equity-commodities-spillover
    runtime: python
    plan: starter
    region: oregon
    numInstances: 1
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt && python make_secrets.py
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false --server.enableWebsocketCompression false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      # AI providers — set at least one of these in Render dashboard > Environment
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Optional data sources
      - key: FRED_API_KEY
        sync: false
      # ── Persistent disk (survives deploys/restarts) ──
      # Backs two things off the ephemeral filesystem:
      #   1. The price parquet cache (loader._resolve_cache_dir → $DIR/price_cache)
      #      so a cold process start reads prices from disk (~0.06s) instead of
      #      re-downloading 30+ tickers — the main cold-start win.
      #   2. The daily "what changed" baseline, giving TRUE day-over-day deltas.
      # Cost: a small monthly disk charge; a disk pins the service to one
      # instance (already numInstances: 1). To disable, re-comment both blocks.
      - key: SPILLOVER_SNAPSHOT_DIR
        value: /var/data
    disk:
      name: snapshot-store
      mountPath: /var/data
      sizeGB: 1
